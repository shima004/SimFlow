apiVersion: apps/v1
kind: Deployment
metadata:
  name: simflow
  labels:
    app: simflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simflow
  template:
    metadata:
      labels:
        app: simflow
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: simflow-data
      containers:
        - name: simflow
          image: simflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # App origin — must match the URL users access the app from (required for CSRF protection)
            - name: ORIGIN
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: ORIGIN
            # Authentication
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: JWT_SECRET
                  optional: true
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: JWT_PUBLIC_KEY
                  optional: true
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: JWT_ALGORITHM
                  optional: true
            - name: ADMIN_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: ADMIN_SUBJECT
                  optional: true
            # SQLite database path
            - name: DB_PATH
              value: /data/simflow.db
            # Argo Workflows
            - name: ARGO_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: ARGO_BASE_URL
            - name: ARGO_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: ARGO_NAMESPACE
            - name: ARGO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: ARGO_TOKEN
                  optional: true
            # S3 bucket names
            - name: S3_AGENTS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: S3_AGENTS_BUCKET
                  optional: true
            - name: S3_MAPS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: S3_MAPS_BUCKET
                  optional: true
            # Workflow templates
            - name: WORKFLOW_TEMPLATES
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: WORKFLOW_TEMPLATES
                  optional: true
            # S3 — endpoint/region/creds are all optional when using IRSA
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: S3_REGION
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
            - name: S3_ALLOWED_BUCKETS
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: S3_ALLOWED_BUCKETS
            # SimScope viewer
            - name: SIMSCOPE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: SIMSCOPE_BASE_URL
                  optional: true
            - name: SIMSCOPE_LOG_BUCKET
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: SIMSCOPE_LOG_BUCKET
                  optional: true
            - name: SIMSCOPE_PORT
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: SIMSCOPE_PORT
                  optional: true
            - name: SIMSCOPE_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: simflow-secret
                  key: SIMSCOPE_NAMESPACE
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
