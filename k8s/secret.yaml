# Template for Secret — fill in base64-encoded values before applying.
# Encode a value: echo -n 'your-value' | base64
#
# Apply with: kubectl apply -f k8s/secret.yaml
# DO NOT commit this file with real values.
apiVersion: v1
kind: Secret
metadata:
  name: simflow-secret
  namespace: simflow
type: Opaque
data:
  # Authentication
  JWT_SECRET: '' # e.g. echo -n 'your-secret' | base64

  ARGO_TOKEN: '' # e.g. echo -n 'token' | base64


  # S3 static credentials (omit both when using IRSA)
  # S3_ACCESS_KEY_ID: ""   # e.g. echo -n 'minioadmin' | base64
  # S3_SECRET_ACCESS_KEY: "" # e.g. echo -n 'minioadmin' | base64
