# Template for Secret — fill in base64-encoded values before applying.
# Encode a value: echo -n 'your-value' | base64
#
# Apply with: kubectl apply -f k8s/secret.yaml
# DO NOT commit this file with real values.
apiVersion: v1
kind: Secret
metadata:
  name: simflow-secret
type: Opaque
data:
  # Argo Workflows
  ARGO_BASE_URL: ""        # e.g. echo -n 'http://argo-server:2746' | base64
  ARGO_NAMESPACE: ""       # e.g. echo -n 'argo' | base64
  ARGO_TOKEN: ""           # e.g. echo -n 'Bearer v2:...' | base64  (optional: omit if in-cluster RBAC)

  # S3 bucket names (optional — defaults: agents / maps)
  # S3_AGENTS_BUCKET: ""  # e.g. echo -n 'agents' | base64
  # S3_MAPS_BUCKET: ""    # e.g. echo -n 'maps' | base64

  # Workflow templates (optional — default: rrs-workflow-python:Python,rrs-workflow-java:Java)
  # WORKFLOW_TEMPLATES: "" # e.g. echo -n 'rrs-workflow-python:Python,rrs-workflow-java:Java' | base64

  # S3 / S3-compatible storage
  # For AWS S3 with IRSA: omit S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY.
  # The SDK will use the pod's service-account token automatically.
  # For MinIO / Ceph: set all fields below.
  # S3_ENDPOINT: ""        # e.g. echo -n 'http://minio:9000' | base64  (omit for AWS S3)
  # S3_REGION: ""          # e.g. echo -n 'us-east-1' | base64          (omit to default to us-east-1)
  # S3_ACCESS_KEY_ID: ""   # e.g. echo -n 'minioadmin' | base64         (omit for IRSA)
  # S3_SECRET_ACCESS_KEY: "" # e.g. echo -n 'minioadmin' | base64       (omit for IRSA)
  S3_ALLOWED_BUCKETS: ""   # e.g. echo -n 'agents,maps' | base64

  # App origin (required) — must match the URL users access the app from
  ORIGIN: ""               # e.g. echo -n 'http://192.168.1.100' | base64

  # Authentication — choose one: JWT_SECRET (HS256) or JWT_PUBLIC_KEY (RS256/ES256)
  JWT_SECRET: ""           # HS256: echo -n 'your-secret' | base64
  # JWT_PUBLIC_KEY: ""     # RS256/ES256: base64-encoded PEM public key
  # JWT_ALGORITHM: ""      # e.g. echo -n 'RS256' | base64  (default: RS256 when JWT_PUBLIC_KEY is set)
  ADMIN_SUBJECT: ""        # e.g. echo -n 'admin@example.com' | base64  (auto-creates admin on first login)

  # SimScope viewer (all optional)
  # SIMSCOPE_BASE_URL: ""  # e.g. echo -n 'http://simscope:3000' | base64
  # SIMSCOPE_LOG_BUCKET: "" # e.g. echo -n 'rrs-logs' | base64
  # SIMSCOPE_PORT: ""      # e.g. echo -n '27931' | base64
  # SIMSCOPE_NAMESPACE: "" # e.g. echo -n 'argo' | base64  (omit to use workflow's namespace)
